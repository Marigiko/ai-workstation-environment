name: Shell Check

on:
  push:
    branches: [ main ]
    paths:
      - 'components/**/*.sh'
      - 'scripts/**/*.sh'
      - 'bootstrap'
  pull_request:
    branches: [ main ]
    paths:
      - 'components/**/*.sh'
      - 'scripts/**/*.sh'
      - 'bootstrap'

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run shellcheck on bootstrap
      run: |
        shellcheck bootstrap

    - name: Run shellcheck on components
      run: |
        find components -name "*.sh" -exec shellcheck {} +

    - name: Run shellcheck on scripts
      run: |
        find scripts -name "*.sh" -exec shellcheck {} +
