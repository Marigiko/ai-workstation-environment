# Fixed 2026-07-30. Previously `npx -y @codebase-memory/mcp-server`, which does not
# exist on npm. It is a released binary from github.com/DeusData/codebase-memory-mcp
# (its install.ps1 in ~/SKILLS/codebase-memory-mcp downloads exactly this).
name: codebase-memory
description: "Persistent memory across sessions"
version: "latest"
enabled: true
priority: immediate

config:
  command: /home/keyz/.local/bin/codebase-memory-mcp
  args: []

install: |
  gh release download --repo DeusData/codebase-memory-mcp \
    --pattern '*linux*amd64*' --dir /tmp/cbm --clobber

update: |
  echo "re-run install to fetch the latest release"
