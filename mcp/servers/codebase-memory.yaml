name: codebase-memory
description: "Persistent memory across AI sessions"
version: "latest"
enabled: true
priority: immediate

config:
  command: npx
  args:
    - -y
    - "@codebase-memory/mcp-server"
  env:
    MEMORY_DIR: "{{ memory_dir | default('~/.codebase-memory') }}"

install: |
  npm install -g @codebase-memory/mcp-server

update: |
  npm update -g @codebase-memory/mcp-server
