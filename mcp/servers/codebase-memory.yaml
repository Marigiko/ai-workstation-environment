name: codebase-memory
description: "Persistent memory across AI sessions"
version: "latest"
enabled: true
priority: immediate

config:
  command: npx
  args:
    - -y
    - "@codebase-memory/mcp-server"
  env:
    MEMORY_DIR: "~/.codebase-memory"

install: |
  echo "codebase-memory MCP: uses npx -y @codebase-memory/mcp-server (downloaded on demand)"

update: |
  echo "codebase-memory MCP: no update needed (npx handles versions)"
