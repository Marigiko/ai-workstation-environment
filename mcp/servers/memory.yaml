name: memory
description: "General-purpose persistent memory"
version: "latest"
enabled: false
priority: nice-to-have

config:
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-memory"
  env:
    MEMORY_FILE: "~/.mcp-memory/memory.json"

install: |
  echo "Memory MCP server is built-in to npx"

update: |
  npx -y @modelcontextprotocol/server-memory --version
