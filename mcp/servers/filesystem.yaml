# Fixed 2026-07-30. Was `npx -y @modelcontextprotocol/server-filesystem`.
# mimo-new reported "Operation timed out after 30000ms" for this server. Cause: a
# standalone/GUI client spawns with a minimal PATH containing neither `npx` NOR `node`
# (both live in ~/.nvm/versions/node/<v>/bin). The npm bin is a Node script with an
# `#!/usr/bin/env node` shebang, so even an absolute path to it fails. The wrapper
# invokes node explicitly, removing every PATH dependency.
name: filesystem
description: "File system operations"
version: "latest"
enabled: true
priority: immediate

config:
  command: /home/keyz/.local/bin/mcp-server-filesystem-wrapped
  args:
    - "{{ HOME }}"

install: |
  npm install -g @modelcontextprotocol/server-filesystem

update: |
  npm update -g @modelcontextprotocol/server-filesystem
