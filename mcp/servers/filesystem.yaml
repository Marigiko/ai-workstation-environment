# Fixed 2026-07-30. Was `npx -y @modelcontextprotocol/server-filesystem`, which
# re-resolves against the npm registry on EVERY start. mimo-new reported
# "Operation timed out after 30000ms" for exactly the two npx-based servers while the
# three using direct binaries connected fine. Installed globally and invoked directly.
name: filesystem
description: "File system operations"
version: "latest"
enabled: true
priority: immediate

config:
  command: /home/keyz/.nvm/versions/node/v24.18.0/bin/mcp-server-filesystem
  args:
    - "{{ HOME }}"

install: |
  npm install -g @modelcontextprotocol/server-filesystem

update: |
  npm update -g @modelcontextprotocol/server-filesystem
