# Fixed 2026-07-30 (second pass). `npx -y headroom-ai` never worked: that npm package
# declares no bin. headroom is a PyPI package; `headroom mcp` is a command GROUP, so the
# server is `headroom mcp serve` ("Start the MCP server (called by Claude Code)").
# It also requires the [mcp] extra, otherwise it exits with "MCP SDK not installed".
# Installed with: uv tool install 'headroom-ai[mcp]'
name: headroom
description: "Context compression"
version: "latest"
enabled: true
priority: immediate

config:
  command: /home/keyz/.local/bin/headroom
  args:
    - mcp
    - serve

install: |
  command -v uv >/dev/null 2>&1 || { echo "uv required"; exit 1; }
  uv tool install --force 'headroom-ai[mcp]'

update: |
  uv tool upgrade headroom-ai
