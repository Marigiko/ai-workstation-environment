name: ponytail
description: "Code quality and lazy development enforcement"
version: "latest"
enabled: true
priority: immediate

config:
  command: npx
  args:
    - -y
    - "@ponytail/mcp-server"

install: |
  echo "ponytail MCP: uses npx -y @ponytail/mcp-server (downloaded on demand)"

update: |
  echo "ponytail MCP: no update needed (npx handles versions)"
