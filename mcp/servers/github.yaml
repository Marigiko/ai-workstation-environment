# Fixed 2026-07-30. Same 30s-timeout cause as filesystem (no node on a minimal PATH),
# plus the token was the literal placeholder "YOUR_GITHUB_TOKEN_HERE", so the server ran
# unauthenticated and rate-limited immediately.
# The wrapper invokes node explicitly and fetches the PAT from the gh CLI at launch, so
# no secret is written into ~/.claude.json, opencode or zed configs. gh is authenticated
# on the Windows side, so the wrapper prefers the Windows binary over interop.
name: github
description: "GitHub API (PRs, issues, checks)"
version: "latest"
enabled: true
priority: immediate

config:
  command: /home/keyz/.local/bin/mcp-server-github-auth
  args: []

install: |
  npm install -g @modelcontextprotocol/server-github

update: |
  npm update -g @modelcontextprotocol/server-github
