environment:
  editor: zed
  shell: zsh

git:
  default_branch: main
  credential_helper: store
  autocrlf: input

docker:
  compose_version: v2

mcp:
  default_enabled:
    - filesystem
    - git
    - github
    - headroom
    - codebase-memory
    - ponytail
    - terax

terax:
  enabled: true
  proxy_url: "http://localhost:8000"
  agent_detection: true
  default_model: "claude-sonnet-4-20250514"
  gateway_auto_start: true
