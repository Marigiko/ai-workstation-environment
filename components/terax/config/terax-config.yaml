# Terax Configuration Reference
# =============================================
# IMPORTANT: Terax does NOT read this YAML file!
# Terax uses its own Settings UI for provider configuration.
# This file is for reference only.
# =============================================

# How to configure Terax providers:
#
# 1. Open Terax
# 2. Press Ctrl+, (Windows/Linux) or Cmd+, (macOS) to open Settings
# 3. Go to "Providers" section
# 4. Add each provider manually:
#
# --- Gemini (Free tier) ---
# Provider Type: Google AI (Gemini)
# API Key: <your-google-api-key-from-ai-studio>
#
# --- OpenCode Go (Free credits) ---
# Provider Type: OpenAI-Compatible
# Name: OpenCode Go
# Base URL: https://openrouter.ai/api/v1
# API Key: <your-openrouter-api-key>
#
# --- Ollama (Local, Free) ---
# Provider Type: Ollama
# Base URL: http://127.0.0.1:11434
#
# --- OmniRoute Gateway (All models) ---
# Provider Type: OpenAI-Compatible
# Name: OmniRoute Gateway
# Base URL: http://localhost:20128/v1
# API Key: <your-omniroute-api-key>
#
# After adding providers, select a model from the model selector in Terax.

# =============================================
# OmniRoute Gateway Models (available via localhost:20128/v1)
# =============================================
# Combos:
#   - liviano - OmniRoute light combo (cheap/free)
#   - agente - OmniRoute heavy combo (hard/coding work)
#
# Local Models (Ollama):
#   - local (qwen2.5-coder:7b) - Best code, fits 6 GB GPU
#   - embeddings (nomic-embed-text) - For RAG
#
# Cloud Models (Free):
#   - free (OpenRouter auto) - Free credits
#
# Cloud Models (Paid):
#   - claude-sonnet-4-20250514 - Anthropic (requires API key)
#   - gpt-4o - OpenAI (requires API key)
#
# Aliases:
#   - fast = local (qwen2.5-coder:7b)
#   - smart = agente
#   - reasoning = gemini-2.5-pro
#   - code = code-7b (qwen2.5-coder:7b)
#   - free = OpenRouter auto
