services:
  workspace-api:
    container_name: awe-workspace-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-awe}:${POSTGRES_PASSWORD:-}@localhost:5433/workspace"
      REDIS_URL: "redis://localhost:6380/0"
      QDRANT_URL: "http://localhost:6335"
      OMNIROUTE_URL: "http://localhost:20128/v1"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
    network_mode: host
    restart: unless-stopped

  workspace-worker:
    container_name: awe-workspace-worker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-awe}:${POSTGRES_PASSWORD:-}@localhost:5433/workspace"
      REDIS_URL: "redis://localhost:6380/0"
      QDRANT_URL: "http://localhost:6335"
      OMNIROUTE_URL: "http://localhost:20128/v1"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
    network_mode: host
    restart: unless-stopped

  redis:
    container_name: awe-workspace-redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
