# Auto Orchestrator - Configuration

# Model assignments per agent type
# Priority: proxy (MiMo/Claude) → local (Ollama) → omniroute (cloud)
# All models go through Headroom compression via AI Proxy (port 8090)
omniroute:
  url: "http://localhost:20128/v1"
  api_key_env: OMNIROUTE_API_KEY
  heavy_model: agente
  light_model: liviano
models:
  architect:
    default: "mimo-auto"           # Free MiMo via proxy
    fallback: "qwen2.5-coder:7b"   # Local Ollama
    cloud: "agente"                # OmniRoute heavy combo

  coder:
    default: "mimo-auto"           # Free MiMo via proxy
    fallback: "qwen2.5-coder:7b"   # Local Ollama
    cloud: "agente"                # OmniRoute heavy combo

  reviewer:
    default: "claude"              # Claude via proxy (Claude Max)
    fallback: "agente"             # OmniRoute heavy combo
    local: "qwen2.5-coder:7b"     # Local fallback

  documenter:
    default: "mimo-fast"           # Fast MiMo via proxy
    fallback: "qwen2.5-coder:7b"   # Local Ollama
    cloud: "liviano"               # OmniRoute light combo

  tester:
    default: "mimo-fast"           # Fast MiMo via proxy
    fallback: "qwen2.5-coder:7b"   # Local Ollama
    cloud: "liviano"               # OmniRoute light combo

  debugger:
    default: "claude"              # Claude via proxy (best reasoning)
    fallback: "qwen2.5-coder:7b"   # Local Ollama
    cloud: "agente"                # OmniRoute heavy combo

# Task decomposition settings
decomposition:
  max_subtasks: 10
  timeout_seconds: 300
  use_llm: true

# Headroom compression settings
# Applied to ALL requests via AI Proxy before reaching any backend
tiers:
  local_fast: [qwen2.5-coder:7b]
  local_balanced: [qwen2.5-coder:7b]
  cloud_light: [liviano]
  cloud_heavy: [agente]

headroom:
  enabled: true
  level: "aggressive"  # aggressive, moderate, light
  preserve_code: true
  preserve_numbers: true
  strategies:
    - normalize_whitespace
    - strip_comments
    - dedup_lines
    - aggressive_compress

# AI Proxy settings (port 8090)
proxy:
  enabled: true
  url: "http://localhost:8090"
  timeout: 120
  backends:
    mimo:
      enabled: true
      models: ["mimo", "mimo-auto", "mimo-fast"]
    claude:
      enabled: true
      models: ["claude", "claude-code"]

# Local Ollama model settings
local_model:
  enabled: true
  ollama_url: "http://localhost:11434"
  default_model: "qwen2.5-coder:7b"
  capability_profile: null  # populated by evaluator
  routing_rules:
    max_difficulty: "medium"
    fallback_model: "cloud"
    timeout_multiplier: 2.0

# Execution settings
execution:
  max_concurrent: 3
  timeout_per_subtask: 120
  retry_count: 2
  retry_delay: 5
  backend_priority:
    - "proxy"      # MiMo/Claude via AI Proxy (free)
    - "local"      # Ollama (local GPU)
    - "omniroute"  # OmniRoute gateway (only cloud path)

# Notification settings
notifications:
  telegram: true
  workspace_api: true
  on_complete: true
  on_error: true
